apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: infra-tools
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: minio
    targetRevision: "17.0.21"
    helm:
      values: |
        mode: standalone

        auth:
          rootUser: minioadmin
          rootPassword: minioadminpass

        defaultBuckets: "mlflow-artifacts"

        image:
          registry: docker.io
          repository: bitnamilegacy/minio
          tag: "2025.7.23-debian-12-r3"

        clientImage:
          registry: docker.io
          repository: bitnamilegacy/minio-client
          tag: "2025.7.21-debian-12-r2"

        console:
          enabled: false

        persistence:
          enabled: false

        service:
          type: ClusterIP
          ports:
            api: 9000

        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: application
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
